<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/sever-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Север</title>
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('sever_theme') || 'null')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
